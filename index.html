<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lodfy — Spotify Playlist Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #121821;
        --border: #2a3747;
        --text: #edf2ff;
        --muted: #aab7c8;
        --accent: #1db954;
        --danger: #ff8585;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, var(--bg), #0f1219);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(760px, 100%);
        padding: clamp(22px, 5vw, 36px);
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(18, 24, 33, 0.94);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
      }

      h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 2.7rem); }
      p { color: var(--muted); line-height: 1.5; }
      form { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
      input {
        flex: 1 1 320px;
        min-width: 0;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0d131b;
        color: var(--text);
        font-size: 1rem;
      }
      input::placeholder { color: #75829a; }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      button {
        padding: 14px 18px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #04150a;
        font-size: 0.96rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      #status { min-height: 24px; margin: 16px 0; color: var(--muted); }
      #status.error { color: var(--danger); }
      .embed-wrap { display: none; overflow: hidden; border-radius: 12px; }
      .embed-wrap.visible { display: block; }
      iframe { display: block; width: 100%; height: 500px; border: 0; border-radius: 12px; }
      .note { margin: 16px 0 0; font-size: 0.84rem; }
      @media (max-width: 560px) {
        body { padding: 14px; }
        form button { width: 100%; }
        iframe { height: 500px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lodfy</h1>
      <p>Paste a Spotify playlist link to view and play its songs. No Spotify client credentials or browser-side API calls are needed.</p>

      <form id="playlistForm">
        <input
          id="playlistUrl"
          type="url"
          placeholder="https://open.spotify.com/playlist/..."
          autocomplete="url"
          spellcheck="false"
          aria-label="Spotify playlist link"
          required
        />
        <button type="submit">Find songs</button>
      </form>

      <div id="status" role="status" aria-live="polite">Enter a playlist link to get started.</div>
      <div id="embedWrap" class="embed-wrap">
        <iframe
          id="playlistEmbed"
          title="Spotify playlist and track list"
          loading="lazy"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
      <p class="note">The playlist is displayed using Spotify’s official embed. Private playlists may not be available.</p>
    </main>

    <script>
      const form = document.getElementById('playlistForm');
      const input = document.getElementById('playlistUrl');
      const status = document.getElementById('status');
      const embedWrap = document.getElementById('embedWrap');
      const playlistEmbed = document.getElementById('playlistEmbed');

      function extractPlaylistId(value) {
        try {
          const url = new URL(value);
          if (!['open.spotify.com', 'www.open.spotify.com'].includes(url.hostname)) return null;
          const parts = url.pathname.split('/').filter(Boolean);
          const playlistIndex = parts.indexOf('playlist');
          const id = playlistIndex >= 0 ? parts[playlistIndex + 1] : null;
          return id && /^[A-Za-z0-9]{22}$/.test(id) ? id : null;
        } catch {
          return null;
        }
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const playlistId = extractPlaylistId(input.value.trim());

        if (!playlistId) {
          embedWrap.classList.remove('visible');
          playlistEmbed.removeAttribute('src');
          status.textContent = 'Please enter a valid Spotify playlist URL.';
          status.classList.add('error');
          return;
        }

        status.classList.remove('error');
        status.textContent = 'Loading playlist…';
        playlistEmbed.src = `https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator&theme=0`;
        embedWrap.classList.add('visible');
        status.textContent = 'Playlist loaded. Its songs are listed in the Spotify player below.';
      });
    </script>
  </body>
</html>
