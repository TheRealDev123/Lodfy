<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lodfy</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #121821;
        --panel-2: #1a2330;
        --border: #2a3747;
        --text: #edf2ff;
        --muted: #aab7c8;
        --accent: #1db954;
        --accent-2: #4cd684;
        --danger: #ff7a7a;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg), #0f1219 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(720px, 100%);
        background: rgba(18, 24, 33, 0.9);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 22px 60px rgba(0,0,0,0.35);
        padding: 28px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 5vw, 2.7rem);
      }

      p {
        color: var(--muted);
        margin: 0 0 18px;
      }

      form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      input {
        flex: 1 1 320px;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0d131b;
        color: var(--text);
        font-size: 1rem;
        padding: 14px 16px;
      }

      input::placeholder {
        color: #75829a;
      }

      button {
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #02160a;
        font-weight: 700;
        font-size: 0.96rem;
        padding: 14px 18px;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.04);
      }

      #status {
        min-height: 24px;
        margin-top: 16px;
        color: var(--muted);
      }

      #status.error {
        color: var(--danger);
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 22px 0 0;
      }

      li {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
      }

      .song-name {
        display: block;
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .song-artists {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .note {
        margin-top: 20px;
        font-size: 0.84rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Lodfy</h1>
      <p>Paste a Spotify playlist link to view the songs in it.</p>

      <form id="playlistForm">
        <input
          id="playlistUrl"
          type="text"
          placeholder="https://open.spotify.com/playlist/..."
          autocomplete="off"
          spellcheck="false"
          required
        />
        <button type="submit">Find songs</button>
      </form>

      <div id="status">Waiting for a playlist link.</div>
      <ul id="songList"></ul>

      <div class="note">
        The Spotify client ID and secret stay on the server, not in the browser.
      </div>
    </main>

    <script>
      const form = document.getElementById('playlistForm');
      const input = document.getElementById('playlistUrl');
      const status = document.getElementById('status');
      const songList = document.getElementById('songList');

      function extractPlaylistId(value) {
        if (!value) return null;

        const match = value.match(/playlist\/([A-Za-z0-9]+)/i);
        if (match) return match[1];

        const direct = value.match(/^([A-Za-z0-9]{22})$/);
        if (direct) return direct[1];

        return null;
      }

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle('error', isError);
      }

      function renderSongs(songs) {
        songList.innerHTML = '';

        if (!songs || songs.length === 0) {
          const li = document.createElement('li');
          li.textContent = 'No songs found in this playlist.';
          songList.appendChild(li);
          return;
        }

        songs.forEach((song, index) => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span class="song-name">${index + 1}. ${song.name}</span>
            <span class="song-artists">${song.artists}</span>
          `;
          songList.appendChild(li);
        });
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const playlistUrl = input.value.trim();
        const playlistId = extractPlaylistId(playlistUrl);

        if (!playlistId) {
          setStatus('Please paste a valid Spotify playlist link.', true);
          songList.innerHTML = '';
          return;
        }

        setStatus('Loading songs...');

        try {
          const response = await fetch('/api/playlist-songs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ playlistId })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Could not load playlist.');
          }

          renderSongs(data.songs);
          setStatus(`Found ${data.songs.length} songs.`);
        } catch (error) {
          setStatus(error.message || 'Something went wrong.', true);
          songList.innerHTML = '';
        }
      });
    </script>
  </body>
</html>
